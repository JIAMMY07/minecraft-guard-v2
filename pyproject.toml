[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-guard-v2"
version = "0.1.0"
description = "Vision-first passive observer for multiple Minecraft windows."
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0.0",
  "psutil>=5.9.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]

